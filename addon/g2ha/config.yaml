name: G2HA Relay
version: "0.3.14"
slug: g2ha_relay
description: Local G2HA relay for Home Assistant and Google Home
arch:
  - amd64
  - aarch64
  - armv7
startup: services
boot: auto
init: false
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: G2HA relay HTTP/WebSocket port
webui: http://[HOST]:[PORT:8000]
ingress: true
ingress_port: 8000
ingress_stream: true
map:
  - data:rw
options:
  environment: production
  oauth_username: ""
  oauth_password: ""
  oauth_client_id: ""
schema:
  environment: str
  oauth_username: str
  oauth_password: password
  oauth_client_id: str


